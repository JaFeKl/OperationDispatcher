name: Test release artifacts

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine ruff
      - run: ruff check src tests
      # The default build creates an sdist, then builds the wheel from that sdist.
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  installed-tests:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']
        profile:
          - name: base
            extras: dev
            constraint: pydantic>=2.8,<3
          - name: api
            extras: dev,api
            constraint: pydantic>=2.8,<3
          - name: mcp-2
            extras: dev,mcp
            constraint: fastmcp==2.14.7
          - name: mcp-3
            extras: dev,mcp
            constraint: fastmcp>=3,<4
          - name: all-mcp-4
            extras: dev,api,mcp,vis
            constraint: fastmcp>=4,<5
        # Exercise the original minimum dependency on its supported interpreter.
        # Newer interpreters resolve compatible dependencies in the base profile.
        include:
          - python-version: '3.12'
            profile:
              name: base-minimum-pydantic
              extras: dev
              constraint: pydantic==2.8.0
    name: Installed wheel (Python ${{ matrix.python-version }}, ${{ matrix.profile.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Install wheel and test selected dependencies
        env:
          TEST_EXTRAS: ${{ matrix.profile.extras }}
          TEST_CONSTRAINT: ${{ matrix.profile.constraint }}
        run: |
          wheel_path=$(find "$PWD/dist" -name '*.whl' -print -quit)
          python -m pip install "${wheel_path}[${TEST_EXTRAS}]" "$TEST_CONSTRAINT"
          python -m pip check
      - name: Test away from the checkout
        run: |
          test_dir=$(mktemp -d)
          cp -R tests "$test_dir/tests"
          cd "$test_dir"
          python -m pytest -c /dev/null tests
